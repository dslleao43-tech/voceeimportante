<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensagem Especial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0d0f17 0%, #030407 100%);
      font-family: 'Georgia', serif;
      overflow: hidden;
      position: relative;
    }

    /* Canvas Cósmico com Estrelas e Chuva Incandescente */
    #cosmicCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #page1 {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    /* Card contenedora por trás do envelope */
    .envelope-card-container {
      background: rgba(15, 23, 42, 0.65);
      padding: 35px 45px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Borda Prateada com Pulsação Suave ao redor do Card */
    @keyframes softSilverPulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(226, 232, 240, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.05);
      }
      50% {
        box-shadow: 0 0 45px rgba(226, 232, 240, 0.45), inset 0 0 25px rgba(255, 255, 255, 0.15);
      }
    }

    .silver-border-glow {
      position: relative;
      padding: 5px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(71, 85, 105, 0.8), rgba(226, 232, 240, 0.6), rgba(148, 163, 184, 0.4));
      animation: softSilverPulse 6s ease-in-out infinite;
    }

    /* Envelope Estilo Pergaminho Envelhecido (Mais Largo e Maior) */
    .envelope-wrapper {
      position: relative;
      width: 480px;
      height: 330px;
      background: 
        radial-gradient(circle at 70% 30%, rgba(139, 107, 71, 0.3) 0%, transparent 60%),
        radial-gradient(circle at 20% 80%, rgba(94, 69, 41, 0.4) 0%, transparent 70%),
        linear-gradient(135deg, #dfcbab 0%, #c4a478 50%, #a68151 100%);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 40px rgba(60, 40, 20, 0.4);
      overflow: hidden;
      border: 1px solid #8c6838;
    }

    .flap {
      position: absolute;
      top: 0; left: 0;
      width: 0; height: 0;
      border-left: 240px solid transparent;
      border-right: 240px solid transparent;
      border-top: 175px solid #ab8553;
      transform-origin: top;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .pocket-left {
      position: absolute; bottom: 0; left: 0;
      width: 0; height: 0;
      border-left: 240px solid #bc986c;
      border-top: 165px solid transparent;
      border-bottom: 165px solid #bc986c;
      z-index: 3;
    }

    .pocket-right {
      position: absolute; bottom: 0; right: 0;
      width: 0; height: 0;
      border-right: 240px solid #bc986c;
      border-top: 165px solid transparent;
      border-bottom: 165px solid #bc986c;
      z-index: 3;
    }

    .pocket-bottom {
      position: absolute; bottom: 0; left: 0;
      width: 0; height: 0;
      border-left: 240px solid transparent;
      border-right: 240px solid transparent;
      border-bottom: 170px solid #af8a5b;
      z-index: 4;
    }

    /* Mensagem com Letra Estilo Clássica Antiga, Bem Legível e Branca */
    .envelope-message {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      text-align: center;
      z-index: 6;
      color: #ffffff;
      font-family: 'Georgia', serif;
      font-size: 1.05rem;
      font-style: italic;
      font-weight: 500;
      line-height: 1.5;
      letter-spacing: 1px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95), 0 0 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    /* Brasão em Cera Sofisticado */
    .wax-seal-shield {
      position: absolute;
      top: 155px;
      left: 50%;
      transform: translateX(-50%);
      width: 82px;
      height: 88px;
      background: radial-gradient(circle at 35% 35%, #7f1d1d 0%, #3f0d0a 70%, #1a0403 100%);
      clip-path: polygon(50% 0%, 100% 18%, 90% 75%, 50% 100%, 10% 75%, 0% 18%);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 7;
      transition: transform 0.3s ease, opacity 0.4s ease, box-shadow 0.3s ease;
      user-select: none;
      border: 2px solid #b45309;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85), inset 0 3px 6px rgba(254, 243, 199, 0.4);
    }

    /* Texto 'ABRIR' em Branco Puro Brilhante com Sombra */
    .wax-seal-shield span {
      font-family: 'Georgia', serif;
      font-size: 0.88rem;
      font-weight: bold;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .wax-seal-shield:hover {
      transform: translateX(-50%) scale(1.1);
      box-shadow: 0 12px 30px rgba(180, 83, 9, 0.5), inset 0 3px 8px rgba(254, 243, 199, 0.6);
    }

    .envelope-wrapper.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-wrapper.open .wax-seal-shield,
    .envelope-wrapper.open .envelope-message {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* Efeito de Zoom Cósmico na Transição */
    .silver-border-glow.zoom-effect {
      animation: zoomInCosmic 0.9s forwards cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes zoomInCosmic {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(3.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <canvas id="cosmicCanvas"></canvas>

  <div id="page1">
    <div class="silver-border-glow" id="borderContainer">
      <div class="envelope-card-container">
        <div class="envelope-wrapper" id="envelope">
          <div class="flap"></div>
          
          <div class="envelope-message">
            Você merece o melhor e por isso fiz com muito carinho
          </div>

          <div class="wax-seal-shield" id="seal">
            <span>Abrir</span>
          </div>

          <div class="pocket-left"></div>
          <div class="pocket-right"></div>
          <div class="pocket-bottom"></div>
        </div>
      </div>
    </div>
  </div>

  <audio id="bgMusic" src="belaeafera.mp3" preload="auto"></audio>

  <script>
    /* Fundo Cósmico com Estrelas de Brilho Dinâmico e Estrelas Incandescentes */
    const canvas = document.getElementById('cosmicCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerWidth;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const stars = [];
    for (let i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.8 + 0.4,
        alpha: Math.random(),
        speed: Math.random() * 0.025 + 0.005,
        growing: Math.random() > 0.5
      });
    }

    const shootingStars = [];
    class ShootingStar {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = -30;
        this.length = Math.random() * 120 + 60;
        this.speed = Math.random() * 6 + 4;
        this.angle = Math.PI / 4 + (Math.random() * 0.1 - 0.05);
        this.opacity = 1;
        this.active = true;
      }
      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.opacity -= 0.008;
        if (this.opacity <= 0 || this.y > height) this.active = false;
      }
      draw() {
        if (!this.active) return;
        ctx.save();
        ctx.globalAlpha = this.opacity;
        const tailX = this.x - Math.cos(this.angle) * this.length;
        const tailY = this.y - Math.sin(this.angle) * this.length;
        
        // Gradiente incandescente e brilhante na estrela cadente
        const gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.3, '#fde047'); // Toque quente/incandescente
        gradient.addColorStop(0.7, 'rgba(203, 213, 225, 0.4)');
        gradient.addColorStop(1, 'transparent');
        
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
        ctx.restore();
      }
    }

    function animateCosmos() {
      ctx.clearRect(0, 0, width, height);
      const grad = ctx.createRadialGradient(width/2, height/2, 10, width/2, height/2, Math.max(width, height));
      grad.addColorStop(0, '#0d0f17');
      grad.addColorStop(1, '#030407');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      stars.forEach(s => {
        if (s.growing) {
          s.alpha += s.speed;
          if (s.alpha >= 1) s.growing = false;
        } else {
          s.alpha -= s.speed;
          if (s.alpha <= 0.2) s.growing = true;
        }
        ctx.fillStyle = `rgba(226, 232, 240, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Frequência de estrelas cadentes passando pelo cenário
      if (Math.random() < 0.04 && shootingStars.length < 4) {
        shootingStars.push(new ShootingStar());
      }
      shootingStars.forEach((ss, index) => {
        ss.update();
        ss.draw();
        if (!ss.active) shootingStars.splice(index, 1);
      });

      requestAnimationFrame(animateCosmos);
    }
    animateCosmos();

    /* Ação ao Clicar no Brasão: Toca a Música, Abre o Envelope e Avança */
    const envelope = document.getElementById('envelope');
    const seal = document.getElementById('seal');
    const borderContainer = document.getElementById('borderContainer');
    const bgMusic = document.getElementById('bgMusic');

    seal.addEventListener('click', () => {
      bgMusic.currentTime = 0;
      bgMusic.play().catch(() => {});

      // Salva estado e o tempo atual para continuar na próxima página
      localStorage.setItem('musicPlaying', 'true');
      localStorage.setItem('musicCurrentTime', '0');

      envelope.classList.add('open');
      borderContainer.classList.add('zoom-effect');

      setTimeout(() => {
        window.location.href = "mundos_diferentes.html";
      }, 750);
    });
  </script>

</body>
</html>
