<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O Encontro dos Mundos Diferentes</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #030613;
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
      position: relative;
      user-select: none;
      color: #e2e8f0;
      padding: 1.5rem 1rem;
    }

    /* Canvas Cósmico de Fundo */
    #cosmicCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* --- BORDA PRATEADA CORRENDO EXCLUSIVAMENTE NO PERÍMETRO EXTERNO --- */
    .silver-running-border {
      position: relative;
      border-radius: 26px;
      padding: 2px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(226, 232, 240, 0.15);
    }

    .silver-running-border::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent 0deg,
        transparent 270deg,
        rgba(148, 163, 184, 0.3) 310deg,
        rgba(255, 255, 255, 0.95) 340deg,
        rgba(226, 232, 240, 0.7) 355deg,
        transparent 360deg
      );
      animation: rotateSilverBorder 4s linear infinite;
      z-index: 1;
    }

    @keyframes rotateSilverBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Card com Fundo Escuro Preservado */
    .glass-card {
      position: relative;
      z-index: 2;
      background: rgba(8, 12, 26, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: #f8fafc;
      border-radius: 24px;
      width: 100%;
    }

    .silver-text-glow {
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 30%, #94a3b8 60%, #ffffff 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(226, 232, 240, 0.4);
    }

    /* Scrollbar Personalizada */
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.2); border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(203,213,225,0.6) 50%, rgba(148,163,184,0.3) 100%);
      border-radius: 10px;
    }

    /* Botões de Navegação */
    .nav-card-btn {
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(148,163,184,0.06) 50%, rgba(15,23,42,0.3) 100%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 12px rgba(226, 232, 240, 0.15);
      transition: all 0.4s ease;
      backdrop-filter: blur(8px);
    }
    .nav-card-btn:hover:not(.disabled-btn) {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.45);
    }
    .disabled-btn {
      opacity: 0.35;
      pointer-events: none;
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* Estilo Personalizado do Input Range */
    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 6px; cursor: pointer;
      background: linear-gradient(90deg, #334155, #cbd5e1, #ffffff, #94a3b8);
      border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 18px; width: 18px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #94a3b8, #334155);
      cursor: pointer; -webkit-appearance: none; margin-top: -6px;
    }

    /* Animações de Transição de Páginas */
    .fade-in { animation: fadeIn 0.45s ease-in-out forwards; }
    .fade-out { animation: fadeOut 0.35s ease-in-out forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- Canvas Cósmico com Estrelas Cadentes -->
  <canvas id="cosmicCanvas"></canvas>

  <div id="app-container" class="z-10 w-full max-w-2xl px-2 sm:px-4 py-4 flex flex-col items-center">
    
    <!-- Player de Áudio Superior -->
    <header class="w-full max-w-xl z-20 mb-6 flex flex-col items-center">
      <div class="w-full bg-slate-950/85 backdrop-blur-md rounded-full px-5 sm:px-6 py-3 border border-slate-400/40 shadow-2xl flex items-center justify-between gap-3 sm:gap-4">
        
        <div class="flex items-center gap-3">
          <button id="playBtn" class="w-10 h-10 rounded-full bg-gradient-to-tr from-slate-200 via-white to-slate-400 text-slate-900 flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all cursor-pointer" title="Tocar / Pausar">
            <i id="playIcon" class="fas fa-play text-sm ml-0.5"></i>
          </button>
          <div class="hidden sm:block">
            <p class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold font-sans">Música de Fundo</p>
            <p class="text-sm font-serif italic text-slate-100 flex items-center gap-1.5">
              <span>Bela e a Fera</span>
              <span id="musicPulse" class="inline-block w-1.5 h-1.5 rounded-full bg-slate-200 animate-ping opacity-0"></span>
            </p>
          </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3 flex-1 max-w-[160px] sm:max-w-xs">
          <i id="volumeIcon" class="fas fa-volume-down text-slate-300 text-xs sm:text-sm"></i>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" class="w-full" title="Volume">
          <i class="fas fa-volume-up text-slate-300 text-xs sm:text-sm"></i>
        </div>

        <span id="volumeValue" class="text-xs font-mono text-slate-300 min-w-[35px] text-right">50%</span>
      </div>
    </header>

    <!-- Moldura da Borda Prateada Animada Externa -->
    <div class="silver-running-border w-full">
      <!-- Card Interior -->
      <main class="glass-card p-6 sm:p-10 text-center flex flex-col items-center">
        
        <!-- Detalhe Ornamental Superior -->
        <div class="mb-4 text-slate-300/70 flex items-center justify-center gap-3 w-full">
          <span class="h-[1px] w-12 bg-gradient-to-r from-transparent to-slate-300/50"></span>
          <i class="fas fa-sparkles text-xs text-slate-200"></i>
          <span class="h-[1px] w-12 bg-gradient-to-l from-transparent to-slate-300/50"></span>
        </div>

        <!-- Título do Card -->
        <h1 id="pageTitle" class="silver-text-glow font-['Cinzel'] font-bold text-2xl sm:text-3xl md:text-4xl tracking-wider uppercase mb-6 border-b border-slate-300/20 pb-4 w-full">
          MUNDOS DIFERENTES
        </h1>

        <!-- Área de Conteúdo Dinâmico -->
        <div id="contentArea" class="w-full max-h-[46vh] overflow-y-auto px-2 sm:px-4 py-1 custom-scroll text-left fade-in">
          <!-- O texto é inserido via JavaScript -->
        </div>

        <!-- Divisor Ornamental dos Botões -->
        <div class="mt-6 pt-2 flex items-center justify-center gap-2 text-slate-300/60 w-full mb-6">
          <span class="h-[1px] w-16 bg-gradient-to-r from-transparent to-slate-300/40"></span>
          <span class="text-xs tracking-widest font-serif text-slate-300">✧ ✦ ✧</span>
          <span class="h-[1px] w-16 bg-gradient-to-l from-transparent to-slate-300/40"></span>
        </div>

        <!-- Botões de Navegação -->
        <div class="flex items-center justify-between w-full px-2 gap-4">
          <button id="prevBtn" class="nav-card-btn cursor-pointer rounded-full px-6 py-2.5 flex items-center justify-center gap-2 group disabled-btn">
            <i class="fas fa-chevron-left text-xs text-slate-300 transform group-hover:-translate-x-1 transition-transform duration-300"></i>
            <span class="font-['Cinzel'] font-semibold text-xs sm:text-sm tracking-[0.2em] uppercase text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-slate-300">
              ANTERIOR
            </span>
          </button>

          <button id="nextBtn" class="nav-card-btn cursor-pointer rounded-full px-6 py-2.5 flex items-center justify-center gap-2 group">
            <span class="font-['Cinzel'] font-semibold text-xs sm:text-sm tracking-[0.2em] uppercase text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-slate-300">
              PRÓXIMA
            </span>
            <i class="fas fa-chevron-right text-xs text-slate-300 transform group-hover:translate-x-1 transition-transform duration-300"></i>
          </button>
        </div>
      </main>
    </div>

    <!-- Rodapé -->
    <footer class="mt-5 text-center">
      <p class="silver-text-glow font-['Great_Vibes'] text-2xl sm:text-3xl tracking-wide opacity-90">
        Páginas de um destino inesperado...
      </p>
    </footer>
  </div>

  <!-- Elemento de Áudio Global -->
  <audio id="bgMusic" src="belaeafera.mp3" loop preload="auto"></audio>

  <script>
    /* --- PÁGINAS E TEXTOS DA HISTÓRIA --- */
    const pages = [
      {
        title: "MUNDOS DIFERENTES",
        content: `
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-5">
            Vim para Belém para resolver algo totalmente inesperado, e tudo ao meu redor foi se tornando um caos. Jamais imaginei que, desde o primeiro dia em que te vi, começaria a me aproximar de você — até porque somos pessoas tão distintas, com pensamentos e caminhos tão diferentes. No entanto, algo em você chamou a minha atenção e me despertou um cuidado genuíno, pois percebi que você não parecia bem.
          </p>
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-5">
            Jamais pensei que, dali em diante, surgiria gradualmente uma linda amizade. Com a sua voz suave e a sua aparência calma, percebi que eu desejava ver o seu bem a todo instante — mesmo quando quase não nos víamos, a não ser no centro espírita. A sua presença sempre foi algo que me traria um conforto profundo, pois em você eu sempre enxerguei a paz.
          </p>
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-2">
            Aos meus longos anos de vida, já passei por muitas provações nada fáceis, porém com aprendizado para que, de alguma forma, possa extrair coisas boas. Apesar de qualquer coisa, me permito não ser vítima da vida. Nós somos espíritas kardecistas e sabemos que tudo é passageiro e que devemos sempre acreditar em dias melhores. Mas aí veio você e me deu um nó na cabeça! Eu, uma mulher super bem resolvida que gosta de mulheres, jamais me imaginei envolvida com um homem hétero. Somos de universos bem diferentes, mas a sua companhia, seu carinho, seu afeto e seu sorriso me fazem tão bem que não tenho como negar: o que sinto por você é absolutamente um amor genuíno.
          </p>
        `
      },
      {
        title: "CONTINUAÇÃO DA JORNADA",
        content: `
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-5">
            Mesmo com todas as surpresas que o tempo nos reserva, compreendi que alguns encontros acontecem com um propósito muito maior do que conseguimos planejar.
          </p>
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-2">
            A cada conversa e a cada gesto simples, continuo descobrindo que o afeto verdadeiro transcende rótulos, distâncias e expectativas. O futuro pertence aos dias que ainda vamos construir.
          </p>
        `
      }
    ];

    let currentPage = 0;

    const pageTitle = document.getElementById('pageTitle');
    const contentArea = document.getElementById('contentArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    /* --- NAVEGAÇÃO E TRANSIÇÃO SUAVE --- */
    function renderPage(index) {
      contentArea.classList.remove('fade-in');
      contentArea.classList.add('fade-out');

      setTimeout(() => {
        pageTitle.textContent = pages[index].title;
        contentArea.innerHTML = pages[index].content;
        contentArea.scrollTop = 0;

        contentArea.classList.remove('fade-out');
        contentArea.classList.add('fade-in');

        if (index === 0) {
          prevBtn.classList.add('disabled-btn');
        } else {
          prevBtn.classList.remove('disabled-btn');
        }

        if (index === pages.length - 1) {
          nextBtn.classList.add('disabled-btn');
        } else {
          nextBtn.classList.remove('disabled-btn');
        }
      }, 350);
    }

    prevBtn.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        renderPage(currentPage);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage(currentPage);
      }
    });

    renderPage(currentPage);

    /* --- CONTROLES E PERSISTÊNCIA DA MÚSICA ENTRE PÁGINAS --- */
    const bgMusic = document.getElementById('bgMusic');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const volumeIcon = document.getElementById('volumeIcon');
    const musicPulse = document.getElementById('musicPulse');

    function updatePlayUI(isPlaying) {
      if (isPlaying) {
        playIcon.className = 'fas fa-pause text-sm ml-0.5';
        musicPulse.classList.remove('opacity-0');
      } else {
        playIcon.className = 'fas fa-play text-sm ml-0.5';
        musicPulse.classList.add('opacity-0');
      }
    }

    // Inicialização automática do áudio recuperando o estado da página anterior
    window.addEventListener('DOMContentLoaded', () => {
      const isPlaying = localStorage.getItem('musicPlaying') === 'true';
      const savedTime = parseFloat(localStorage.getItem('musicCurrentTime') || '0');

      if (isPlaying) {
        bgMusic.currentTime = savedTime;
        bgMusic.play().then(() => {
          updatePlayUI(true);
        }).catch(() => {
          // Caso o navegador barre o autoplay, ativa ao primeiro toque/clique na tela
          const unlockAudio = () => {
            bgMusic.currentTime = parseFloat(localStorage.getItem('musicCurrentTime') || savedTime);
            bgMusic.play();
            updatePlayUI(true);
            window.removeEventListener('click', unlockAudio);
            window.removeEventListener('touchstart', unlockAudio);
          };
          window.addEventListener('click', unlockAudio);
          window.addEventListener('touchstart', unlockAudio);
        });

        // Atualiza periodicamente o tempo no localStorage
        setInterval(() => {
          if (!bgMusic.paused) {
            localStorage.setItem('musicCurrentTime', bgMusic.currentTime.toString());
          }
        }, 250);
      }
    });

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          updatePlayUI(true);
          localStorage.setItem('musicPlaying', 'true');
        }).catch(err => console.log(err));
      } else {
        bgMusic.pause();
        updatePlayUI(false);
        localStorage.setItem('musicPlaying', 'false');
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      bgMusic.volume = val;
      volumeValue.textContent = `${Math.round(val * 100)}%`;
      
      if (val === 0) {
        volumeIcon.className = 'fas fa-volume-mute text-slate-400 text-xs sm:text-sm';
      } else if (val < 0.5) {
        volumeIcon.className = 'fas fa-volume-down text-slate-300 text-xs sm:text-sm';
      } else {
        volumeIcon.className = 'fas fa-volume-up text-slate-200 text-xs sm:text-sm';
      }
    });

    window.addEventListener('beforeunload', () => {
      localStorage.setItem('musicCurrentTime', bgMusic.currentTime.toString());
    });

    /* --- CANVAS CÓSMICO COM ESTRELAS CADENTES --- */
    const canvas = document.getElementById('cosmicCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const stars = [];
    for (let i = 0; i < 160; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.5 + 0.3,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005,
        growing: Math.random() > 0.5
      });
    }

    const shootingStars = [];
    class ShootingStar {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = -20;
        this.length = Math.random() * 80 + 40;
        this.speed = Math.random() * 5 + 3;
        this.angle = Math.PI / 4 + (Math.random() * 0.1 - 0.05);
        this.opacity = 1;
        this.active = true;
      }
      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.opacity -= 0.01;
        if (this.opacity <= 0 || this.y > height) this.active = false;
      }
      draw() {
        if (!this.active) return;
        ctx.save();
        ctx.globalAlpha = this.opacity;
        const tailX = this.x - Math.cos(this.angle) * this.length;
        const tailY = this.y - Math.sin(this.angle) * this.length;
        const gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.5, 'rgba(203, 213, 225, 0.5)');
        gradient.addColorStop(1, 'transparent');
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
        ctx.restore();
      }
    }

    function animateCosmos() {
      ctx.clearRect(0, 0, width, height);
      const grad = ctx.createRadialGradient(width/2, height/2, 10, width/2, height/2, Math.max(width, height));
      grad.addColorStop(0, '#0d0f17');
      grad.addColorStop(1, '#030407');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      stars.forEach(s => {
        if (s.growing) { s.alpha += s.speed; if (s.alpha >= 1) s.growing = false; }
        else { s.alpha -= s.speed; if (s.alpha <= 0.2) s.growing = true; }
        ctx.fillStyle = `rgba(226, 232, 240, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      if (Math.random() < 0.03 && shootingStars.length < 3) {
        shootingStars.push(new ShootingStar());
      }
      shootingStars.forEach((ss, index) => {
        ss.update();
        ss.draw();
        if (!ss.active) shootingStars.splice(index, 1);
      });

      requestAnimationFrame(animateCosmos);
    }

    window.onload = function() {
      animateCosmos();
    };
  </script>
</body>
</html>
