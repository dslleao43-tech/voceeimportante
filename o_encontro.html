<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O Encontro</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #030613;
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
      position: relative;
      user-select: none;
      color: #e2e8f0;
    }

    /* Canvas Cósmico Fundo */
    #cosmicCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* --- BORDA PRATEADA CORRENDO NO PERÍMETRO EXTERNO --- */
    .silver-running-border {
      position: relative;
      border-radius: 24px;
      padding: 2px;
      overflow: hidden;
    }

    .silver-running-border::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent 0deg,
        transparent 280deg,
        rgba(148, 163, 184, 0.3) 320deg,
        rgba(255, 255, 255, 1) 345deg,
        rgba(226, 232, 240, 0.8) 355deg,
        transparent 360deg
      );
      animation: rotateSilverBorder 4s linear infinite;
      z-index: 1;
    }

    @keyframes rotateSilverBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* --- ESTILOS DO CARD --- */
    .silver-text-glow {
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 30%, #94a3b8 60%, #ffffff 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(226, 232, 240, 0.4);
    }

    .glass-card {
      position: relative;
      z-index: 2;
      background: rgba(10, 15, 30, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #f8fafc;
      border-radius: 22px;
      width: 100%;
    }

    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.2); border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(203,213,225,0.7) 50%, rgba(148,163,184,0.4) 100%);
      border-radius: 10px;
    }

    .nav-card-btn {
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(148,163,184,0.06) 50%, rgba(15,23,42,0.3) 100%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 12px rgba(226, 232, 240, 0.15);
      transition: all 0.4s ease;
      backdrop-filter: blur(8px);
    }
    .nav-card-btn:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
    }

    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 6px; cursor: pointer;
      background: linear-gradient(90deg, #334155, #cbd5e1, #ffffff, #94a3b8);
      border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 18px; width: 18px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #94a3b8, #334155);
      cursor: pointer; -webkit-appearance: none; margin-top: -6px;
    }

    .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
    .fade-out { animation: fadeOut 0.4s ease-in-out forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- Canvas Cósmico de Fundo com Estrelas Cadentes -->
  <canvas id="cosmicCanvas"></canvas>

  <div id="app-container" class="z-10 w-full max-w-2xl px-4 py-6 flex flex-col items-center">
    
    <!-- Player de Áudio Superior (Toca continuamente) -->
    <header class="w-full max-w-xl z-20 mb-6 flex flex-col items-center">
      <div class="w-full bg-slate-950/85 backdrop-blur-md rounded-full px-6 py-3 border border-slate-400/40 shadow-2xl flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <button id="playBtn" class="w-10 h-10 rounded-full bg-gradient-to-tr from-slate-200 via-white to-slate-400 text-slate-900 flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all cursor-pointer">
            <i id="playIcon" class="fas fa-play text-sm ml-0.5"></i>
          </button>
          <div class="hidden sm:block">
            <p class="text-xs uppercase tracking-widest text-slate-300 font-semibold font-sans">Música de Fundo</p>
            <p class="text-sm font-serif italic text-slate-100 flex items-center gap-1">
              <span>Bela e a Fera</span>
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-slate-200 animate-ping"></span>
            </p>
          </div>
        </div>
        <div class="flex items-center gap-3 flex-1 max-w-xs">
          <i id="volumeIcon" class="fas fa-volume-down text-slate-300 text-xs sm:text-sm"></i>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" class="w-full">
          <i class="fas fa-volume-up text-slate-300 text-xs sm:text-sm"></i>
        </div>
        <span id="volumeValue" class="text-xs font-mono text-slate-300 min-w-[35px] text-right">50%</span>
      </div>
    </header>

    <!-- Container da Borda Prateada Animada -->
    <div class="silver-running-border w-full shadow-2xl">
      <!-- Conteúdo do Card Interior -->
      <main class="glass-card p-7 sm:p-10 text-center flex flex-col items-center">
        <div class="mb-3 text-slate-300/70 flex items-center gap-3">
          <span class="h-[1px] w-12 bg-gradient-to-r from-transparent to-slate-300/50"></span>
          <i class="fas fa-sparkles text-sm text-slate-200"></i>
          <span class="h-[1px] w-12 bg-gradient-to-l from-transparent to-slate-300/50"></span>
        </div>

        <h1 id="pageTitle" class="silver-text-glow font-['Cinzel'] font-bold text-2xl sm:text-3xl md:text-4xl tracking-wider uppercase mb-6 border-b border-slate-300/20 pb-4 w-full">
          A BELA E A FERA
        </h1>

        <!-- Área de Texto Dinâmico com Fade e Scroll -->
        <div id="contentArea" class="w-full max-h-[44vh] overflow-y-auto px-3 py-1 custom-scroll text-left fade-in">
          <!-- O conteúdo será injetado pelo JavaScript -->
        </div>

        <div class="mt-6 pt-2 flex items-center justify-center gap-2 text-slate-300/60 w-full mb-6">
          <span class="h-[1px] w-16 bg-gradient-to-r from-transparent to-slate-300/40"></span>
          <span class="text-xs tracking-widest font-serif text-slate-300">✧ ✦ ✧</span>
          <span class="h-[1px] w-16 bg-gradient-to-l from-transparent to-slate-300/40"></span>
        </div>

        <!-- Botões de Navegação -->
        <div class="flex items-center justify-between w-full px-2 gap-4">
          <button id="prevBtn" class="nav-card-btn cursor-pointer rounded-full px-6 py-2.5 flex items-center justify-center gap-2 group opacity-50 pointer-events-none">
            <i class="fas fa-chevron-left text-xs text-slate-300 transform group-hover:-translate-x-1 transition-transform duration-300"></i>
            <span class="font-['Cinzel'] font-semibold text-xs sm:text-sm tracking-[0.2em] uppercase text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-slate-300">
              ANTERIOR
            </span>
          </button>

          <button id="nextBtn" class="nav-card-btn cursor-pointer rounded-full px-6 py-2.5 flex items-center justify-center gap-2 group">
            <span class="font-['Cinzel'] font-semibold text-xs sm:text-sm tracking-[0.2em] uppercase text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-slate-300">
              PRÓXIMA
            </span>
            <i class="fas fa-chevron-right text-xs text-slate-300 transform group-hover:translate-x-1 transition-transform duration-300"></i>
          </button>
        </div>
      </main>
    </div>

    <footer class="mt-4 text-center">
      <p class="silver-text-glow font-['Great_Vibes'] text-2xl sm:text-3xl tracking-wide opacity-90">
        Páginas de um destino inesperado...
      </p>
    </footer>
  </div>

  <!-- Áudio Único -->
  <audio id="bgMusic" src="belaeafera.mp3" loop preload="auto"></audio>

  <script>
    /* --- ESTRUTURA DE PÁGINAS --- */
    const pages = [
      {
        title: "A BELA E A FERA",
        content: `
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-5">
            Vim para Belém para resolver algo totalmente inesperado, e tudo ao meu redor foi se tornando um caos. Jamais imaginei que, desde o primeiro dia em que te vi, começaria a me aproximar de você — até porque somos pessoas tão distintas, com pensamentos e caminhos tão diferentes. No entanto, algo em você chamou a minha atenção e me despertou um cuidado genuíno, pois percebi que você não parecia bem.
          </p>
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-5">
            Jamais pensei que, dali em diante, surgiria gradualmente uma linda amizade. Com a sua voz suave e a sua aparência calma, percebi que eu desejava ver o seu bem a todo instante — mesmo quando quase não nos víamos, a não ser no centro espírita. A sua presença sempre foi algo que me trazia um conforto profundo, pois em você eu sempre enxerguei a paz.
          </p>
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-2">
            Aos meus longos anos de vida, já passei por muitas provações nada fáceis, porém com aprendizado para que, de alguma forma, possa extrair coisas boas. Apesar de qualquer coisa, me permito não ser vítima da vida. Nós somos espíritas kardecistas e sabemos que tudo é passageiro e que devemos sempre acreditar em dias melhores. Mas aí veio você e me deu um nó na cabeça! Eu, uma mulher super bem resolvida que gosta de mulheres, jamais me imaginei envolvida com um homem hétero. Somos de universos bem diferentes, mas a sua companhia, seu carinho, seu afeto e seu sorriso me fazem tão bem que não tenho como negar: o que sinto por você é absolutamente um amor genuíno.
          </p>
        `
      },
      {
        title: "O ENCONTRO",
        content: `
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-5">
            Sabe, a nossa história tem muito daquele conto da Bela e a Fera. Nós viemos de mundos completamente diferentes, de caminhos que pareciam não se cruzar. Mas quando a gente se encontrou, a aparência e qualquer tipo de preconceito simplesmente sumiram — eles nunca fizeram parte da nossa história. O que importou de verdade foi a alma.
          </p>
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-5">
            A Bela e a Fera nos ensinam que o castelo não é só um lugar de pedra, mas sim o mundo que a gente constrói por dentro. Lá fora, o mundo pode fazer barulho, julgar ou não entender nada sobre nós. Mas quando estamos juntos, criamos o nosso próprio universo protegido. O mundo externo não tem poder para atrapalhar o que é verdadeiro no nosso mundo interno; a paz que sentimos um no outro é blindada por um afeto sincero.
          </p>
          <p class="font-['Cormorant_Garamond'] text-lg sm:text-xl md:text-2xl leading-relaxed text-slate-100 font-normal italic mb-2">
            A gente viveu e continua vivendo momentos mágicos, com aquele frio na barriga gostoso, parecendo dois adolescentes descobrindo o amor, mas com a maturidade e a certeza de quem já sabe o que quer da vida. Cada dia que passa é um presente: a gente se conhece mais, se entende mais, aceita as diferenças do outro e vê a vontade de estar perto, de trocar um abraço, um carinho e um sorriso crescer a cada instante. Estar com você é meu refúgio e minha paz, e o que sinto por você é de uma verdade tão bonita que não tem como disfarçar, através dos olhos que brilham como estrelas no céu.
          </p>
        `
      }
    ];

    let currentPage = 0;

    const pageTitle = document.getElementById('pageTitle');
    const contentArea = document.getElementById('contentArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderPage(index) {
      contentArea.classList.remove('fade-in');
      contentArea.classList.add('fade-out');

      setTimeout(() => {
        pageTitle.textContent = pages[index].title;
        contentArea.innerHTML = pages[index].content;
        contentArea.scrollTop = 0;

        contentArea.classList.remove('fade-out');
        contentArea.classList.add('fade-in');

        if (index === 0) {
          prevBtn.classList.add('opacity-50', 'pointer-events-none');
        } else {
          prevBtn.classList.remove('opacity-50', 'pointer-events-none');
        }

        if (index === pages.length - 1) {
          nextBtn.classList.add('opacity-50', 'pointer-events-none');
        } else {
          nextBtn.classList.remove('opacity-50', 'pointer-events-none');
        }
      }, 400);
    }

    prevBtn.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        renderPage(currentPage);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage(currentPage);
      }
    });

    renderPage(currentPage);

    /* --- CANVAS CÓSMICO --- */
    const canvas = document.getElementById('cosmicCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const stars = [];
    for (let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.6 + 0.3,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005,
        growing: Math.random() > 0.5
      });
    }

    const shootingStars = [];
    class ShootingStar {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = -20;
        this.length = Math.random() * 80 + 40;
        this.speed = Math.random() * 5 + 3;
        this.angle = Math.PI / 4 + (Math.random() * 0.1 - 0.05);
        this.opacity = 1;
        this.active = true;
      }
      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.opacity -= 0.01;
        if (this.opacity <= 0 || this.y > height) this.active = false;
      }
      draw() {
        if (!this.active) return;
        ctx.save();
        ctx.globalAlpha = this.opacity;
        const tailX = this.x - Math.cos(this.angle) * this.length;
        const tailY = this.y - Math.sin(this.angle) * this.length;
        const gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.5, 'rgba(203, 213, 225, 0.5)');
        gradient.addColorStop(1, 'transparent');
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
        ctx.restore();
      }
    }

    function animateCosmos() {
      ctx.clearRect(0, 0, width, height);
      const grad = ctx.createRadialGradient(width/2, height/2, 10, width/2, height/2, Math.max(width, height));
      grad.addColorStop(0, '#0d0f17');
      grad.addColorStop(1, '#030407');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      stars.forEach(s => {
        if (s.growing) { s.alpha += s.speed; if (s.alpha >= 1) s.growing = false; }
        else { s.alpha -= s.speed; if (s.alpha <= 0.2) s.growing = true; }
        ctx.fillStyle = `rgba(226, 232, 240, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      if (Math.random() < 0.03 && shootingStars.length < 3) {
        shootingStars.push(new ShootingStar());
      }
      shootingStars.forEach((ss, index) => {
        ss.update();
        ss.draw();
        if (!ss.active) shootingStars.splice(index, 1);
      });

      requestAnimationFrame(animateCosmos);
    }
    animateCosmos();

    /* --- CONTROLES DO PLAYER DE ÁUDIO --- */
    const bgMusic = document.getElementById('bgMusic');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const volumeIcon = document.getElementById('volumeIcon');

    playBtn.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          playIcon.className = 'fas fa-pause text-sm ml-0.5';
        }).catch(err => console.log("Permissão de áudio necessária:", err));
      } else {
        bgMusic.pause();
        playIcon.className = 'fas fa-play text-sm ml-0.5';
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      bgMusic.volume = val;
      volumeValue.textContent = `${Math.round(val * 100)}%`;
      if (val === 0) volumeIcon.className = 'fas fa-volume-mute text-slate-400 text-xs sm:text-sm';
      else if (val < 0.5) volumeIcon.className = 'fas fa-volume-down text-slate-300 text-xs sm:text-sm';
      else volumeIcon.className = 'fas fa-volume-up text-slate-200 text-xs sm:text-sm';
    });
  </script>
</body>
</html>
